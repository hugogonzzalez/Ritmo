<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot con OpenRouter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .chat {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    header {
      padding: 16px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: #e5e7eb; color: #111; }
    .error { align-self: center; background: #fee2e2; color: #991b1b; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #9ca3af; cursor: default; }
  </style>
</head>
<body>
  <div class="chat">
    <header>Mi chatbot con OpenRouter</header>

    <div id="messages">
      <div class="msg assistant">¡Hola! ¿En qué te puedo ayudar?</div>
    </div>

    <form id="form">
      <input id="input" type="text" placeholder="Escribe un mensaje..." autocomplete="off" required />
      <button id="send" type="submit">Enviar</button>
    </form>
  </div>

  <script>
    // Historial de la conversación que se envía al servidor en cada mensaje
    const history = [];

    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // Añade un globo de mensaje a la pantalla (textContent evita inyección de HTML)
    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      history.push({ role: 'user', content: text });
      input.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error desconocido');
        }

        addMessage(data.reply, 'assistant');
        history.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        addMessage('Error: ' + err.message, 'error');
        history.pop(); // quitamos el mensaje del usuario que no obtuvo respuesta
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
