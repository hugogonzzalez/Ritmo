<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot IA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chat">
    <header>
      <h1>🤖 Agente IA</h1>
      <button id="btnBorrar">Nueva conversación</button>
    </header>

    <div id="mensajes" class="mensajes">
      <div class="msg bot">¡Hola! Pregúntame lo que quieras. También sé la hora y hacer cuentas.</div>
    </div>

    <form id="formulario">
      <input id="entrada" type="text" placeholder="Escribe tu mensaje..." autocomplete="off" required>
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
